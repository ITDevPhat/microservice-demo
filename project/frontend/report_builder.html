<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporting Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/themes/default/style.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-100 min-h-screen">
  <nav class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between shadow">
    <h1 class="text-xl font-semibold"><i class="fa-solid fa-table-cells-large mr-2"></i>Reporting Builder</h1>
    <div class="space-x-5">
      <a class="hover:text-sky-300" href="index.html">Home</a>
      <a class="hover:text-sky-300" href="report_builder.html">Report Builder</a>
    </div>
  </nav>

  <main class="p-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <section class="lg:col-span-3 bg-[#f3f2f1] border border-slate-200 flex flex-col h-[calc(100vh-6rem)] sticky top-6">
        <div class="p-3 pb-2 pt-4">
          <h2 class="text-[15px] font-semibold text-[#252423] mb-3 px-1">Data</h2>
          
          <div class="relative shrink-0">
            <i class="fa-solid fa-search absolute left-2.5 top-1.5 text-[#605e5c] text-[13px]"></i>
            <input type="text" id="field-search" placeholder="Search" class="w-full border border-[#8a8886] rounded-sm pl-8 pr-2 py-1 text-[13px] text-[#252423] bg-white focus:border-[#0078d4] focus:outline-none placeholder-[#605e5c]" />
          </div>
        </div>
        
        <div id="schema-tree" class="flex-1 overflow-y-auto pb-4"></div>
      </section>

      <section class="lg:col-span-9 space-y-4" id="configuration-root">
        <div class="bg-white rounded-lg shadow-sm p-4">
          <h3 class="font-semibold text-slate-800 mb-3">B1 — Report Metadata</h3>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Report Name</label>
              <input type="text" placeholder="Enter report name..." class="w-full border border-slate-300 rounded-md px-3 py-2 focus:border-[#0078d4] focus:outline-none" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Report Description</label>
              <input type="text" placeholder="Enter description..." class="w-full border border-slate-300 rounded-md px-3 py-2 focus:border-[#0078d4] focus:outline-none" />
            </div>
          </div>
        </div>

        <div id="section-filter" class="bg-white rounded-lg shadow-sm p-4">
          <h3 class="font-semibold text-slate-800 mb-3">B2 — Filters</h3>
          <div class="drop-zone" data-zone="filters" data-accepts="field"><span class="drop-placeholder">Drag fields here</span></div>
        </div>

        <div id="section-scope" class="bg-white rounded-lg shadow-sm p-4">
          <h3 class="font-semibold text-slate-800 mb-3">B3 — Scope</h3>
          <div class="grid md:grid-cols-3 gap-3">
            <select id="datatype-select" class="border border-slate-300 rounded-md px-3 py-2"></select>
            <select id="sponsor-select" class="border border-slate-300 rounded-md px-3 py-2"></select>
            <select id="therapeutic-area-select" class="border border-slate-300 rounded-md px-3 py-2"></select>
          </div>
        </div>

        <div id="section-header-footer" class="bg-white rounded-lg shadow-sm p-4">
          <h3 class="font-semibold text-slate-800 mb-2">B4 — Header and Footer</h3>
          <div class="flex items-center gap-4 mb-3">
            <label class="text-sm text-slate-700 flex items-center gap-2">
              <input id="datetime-toggle" type="checkbox" class="h-4 w-4" /> DateTime
            </label>
            <input type="text" placeholder="Title" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm" />
          </div>
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <h4 class="text-sm font-medium text-slate-700 mb-2">Header</h4>
              <div class="drop-zone" data-zone="header" data-accepts="field"><span class="drop-placeholder">Drag fields here</span></div>
            </div>
            <div>
              <h4 class="text-sm font-medium text-slate-700 mb-2">Footer</h4>
              <div class="drop-zone" data-zone="footer" data-accepts="field"><span class="drop-placeholder">Drag fields here</span></div>
            </div>
          </div>
        </div>

        <div id="section-report-body" class="bg-white rounded-lg shadow-sm p-4">
          <h3 class="font-semibold text-slate-800 mb-3">B5 — Report Body</h3>
          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <h4 class="text-sm font-medium text-slate-700 mb-2">GROUP BY</h4>
              <div class="drop-zone" data-zone="group-by" data-accepts="field"><span class="drop-placeholder">Drag fields here</span></div>
            </div>
            <div>
              <h4 class="text-sm font-medium text-slate-700 mb-2">COLUMNS</h4>
              <div class="drop-zone" data-zone="columns" data-accepts="any"><span class="drop-placeholder">Drag fields or measures here</span></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/jstree.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
